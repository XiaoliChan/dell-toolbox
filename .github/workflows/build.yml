name: windows build

# Actions minutes are metered on private repos: build only release tags and
# manual dispatches. Both tests and release packaging run on Windows; mock HAL
# is only a test backend, not a separately shipped client.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Windows MSVC, mock HAL)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure (mock HAL, tests enabled)
        shell: pwsh
        run: |
          cmake -S . -B build-tests -A x64 -DDTB_HAL=mock -DBUILD_TESTING=ON `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build tests and mock application
        run: cmake --build build-tests --config Release --parallel 2
      - name: Run core, HAL contract and UI tests
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          ctest --test-dir build-tests -C Release --output-on-failure --timeout 120
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: build-tests/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: windows build (portable + installer)
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write # publish the release on tag builds
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3 (msvc)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure (win HAL)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DDTB_HAL=win -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Release
      - name: Deploy Qt runtime (portable)
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter dell-toolbox.exe | Where-Object { $_.DirectoryName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem build -Recurse -Filter dell-toolbox.exe | Select-Object -First 1 }
          if (-not $exe) { throw "dell-toolbox.exe not found in build/" }
          "exe: $($exe.FullName)"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Add-Content $env:GITHUB_ENV "exe_dir=$($exe.DirectoryName)"
          Add-Content $env:GITHUB_PATH (Split-Path $exe.FullName)
      - name: Package portable zip
        shell: pwsh
        run: |
          $dir = $env:exe_dir
          $stage = "stage\dell-toolbox"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$dir\dell-toolbox.exe" $stage
          Copy-Item "$dir\*.dll" $stage -ErrorAction SilentlyContinue
          foreach ($sub in @("platforms", "styles", "imageformats", "iconengines", "translations")) {
            if (Test-Path "$dir\$sub") { Copy-Item "$dir\$sub" "$stage\$sub" -Recurse }
          }
          # VC runtime DLLs: without them machines lacking the VC++ redist fail
          # with a "side-by-side configuration is incorrect" error at launch.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          "vs: $vsPath"
          $dll = Get-ChildItem "$vsPath\VC\Redist" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue |
                 Where-Object { $_.DirectoryName -match '\\x64\\' -and $_.DirectoryName -notmatch 'onecore' } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem "$vsPath\VC\Redist" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue |
                   Where-Object { $_.DirectoryName -match '\\x64\\' } | Select-Object -First 1
          }
          if ($dll) {
            "VC runtime from: $($dll.Directory)"
            Copy-Item "$($dll.Directory)\*.dll" $stage -Force
          } else {
            Get-ChildItem "$vsPath\VC\Redist" -Recurse -Directory | ForEach-Object { $_.FullName }
            throw "VC runtime redist not found"
          }
          Copy-Item LICENSE, README.md -Destination $stage
          # Contents at the zip root: unzipping yields the app folder
          # contents directly instead of a nested folder-in-folder.
          Compress-Archive -Path "$stage\*" -DestinationPath dell-toolbox-windows-x64.zip -Force
          Get-ChildItem $stage | ForEach-Object { $_.Name }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }
          $appInfo = Get-Content "src/core/AppInfo.h" -Raw
          if ($appInfo -notmatch 'kVersion\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Unable to read application version"
          }
          $ver = $Matches[1]
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "Release tag does not match application version $ver"
          }
          # ISCC resolves relative /D paths against the .iss location (res/):
          # pass absolute stage/dist paths from the workspace root.
          $stageAbs = Join-Path (Get-Location).Path "stage\dell-toolbox"
          $distAbs = Join-Path (Get-Location).Path "dist"
          & $iscc "/DStageDir=$stageAbs" "/DAppVersion=$ver" "/O$distAbs" res\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Launch smoke test (real admin build)
        shell: pwsh
        run: |
          # The runner session is elevated, so the requireAdministrator build
          # must launch directly. This is the exact exe we ship.
          $exe = Join-Path (Get-Location).Path "stage\dell-toolbox\dell-toolbox.exe"
          if (-not (Test-Path $exe)) { throw "smoke exe not found: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -PassThru -Wait
          "smoke exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match "SideBySide|.NET Runtime|Application Error" } |
              ForEach-Object { "$($_.ProviderName): $($_.Message)" }
            throw "launch smoke failed"
          }

      - name: Publish release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @("dell-toolbox-windows-x64.zip")
          $setup = Get-ChildItem "dist\DellToolbox-*-setup.exe" -ErrorAction SilentlyContinue
          if ($setup) { $files += $setup.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft=false --title "Dell Toolbox $tag" --generate-notes `
              --notes "Portable zip: unzip and run dell-toolbox.exe (administrator). The -setup.exe is an optional installer."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dell-toolbox-windows-x64
          path: |
            dell-toolbox-windows-x64.zip
            dist/DellToolbox-*-setup.exe
          if-no-files-found: error
          retention-days: 14
